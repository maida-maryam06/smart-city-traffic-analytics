<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrafficOS — Smart City Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #05080f;
            --surface: #0c1220;
            --border: #1a2640;
            --accent: #00e5ff;
            --accent2: #ff6b35;
            --green: #00ff88;
            --text: #e0eeff;
            --muted: #4a6080;
            --danger: #ff3d5a;
            --font-mono: 'Space Mono', monospace;
            --font-display: 'Syne', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-display);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated city grid background */
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridPan 20s linear infinite;
        }
        @keyframes gridPan {
            0% { transform: translateY(0); }
            100% { transform: translateY(48px); }
        }

        /* Scanning line effect */
        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,229,255,0.015) 2px,
                rgba(0,229,255,0.015) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* City glow orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }
        .orb-1 { width: 500px; height: 500px; background: var(--accent); top: -150px; right: -100px; animation: float 8s ease-in-out infinite; }
        .orb-2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; left: -100px; animation: float 10s ease-in-out infinite reverse; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.05); }
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-logo {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 32px;
            letter-spacing: -1px;
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .brand-logo .icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), #0088ff);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0,229,255,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(0,229,255,0); }
        }

        .brand-sub {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0,229,255,0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        .card-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 6px;
        }

        .card-sub {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text);
            font-family: var(--font-mono);
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,229,255,0.1);
        }

        input::placeholder { color: var(--muted); }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent), #0088ff);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0,229,255,0.3);
        }

        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .links {
            margin-top: 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .links a {
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            transition: opacity 0.2s;
        }
        .links a:hover { opacity: 0.7; }

        .links .divider {
            color: var(--muted);
            font-size: 11px;
            font-family: var(--font-mono);
        }

        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-family: var(--font-mono);
            display: none;
        }

        .message.success {
            display: block;
            background: rgba(0,255,136,0.1);
            border: 1px solid rgba(0,255,136,0.3);
            color: var(--green);
        }

        .message.error {
            display: block;
            background: rgba(255,61,90,0.1);
            border: 1px solid rgba(255,61,90,0.3);
            color: var(--danger);
        }

        /* Status dots at bottom */
        .status-bar {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--muted);
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            animation: blink 2s ease-in-out infinite;
        }
        .dot.orange { background: var(--accent2); animation-delay: 0.5s; }
        .dot.blue { background: var(--accent); animation-delay: 1s; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="scanline"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-wrapper">
        <div class="brand">
            <div class="brand-logo">
                <div class="icon">🚦</div>
                TrafficOS
            </div>
            <div class="brand-sub">Smart City Analytics Platform</div>
        </div>

        <div class="card">
            <div class="card-title">Welcome back</div>
            <div class="card-sub">// ENTER CREDENTIALS TO AUTHENTICATE</div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="enter username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">
                    Access Dashboard →
                </button>
            </form>

            <div class="message" id="message"></div>

            <div class="links">
                <div class="divider">— or —</div>
                <a href="signup.html">Create new account</a>
                <a href="admin-signup.html">Admin registration →</a>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-item"><div class="dot"></div> LIVE</div>
            <div class="status-item"><div class="dot orange"></div> 200 VEHICLES</div>
            <div class="status-item"><div class="dot blue"></div> REAL-TIME</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + type;
            if (type === 'success') setTimeout(() => el.className = 'message', 5000);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMessage('✅ Authenticated. Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = data.user.is_admin ? 'admin-dashboard.html' : 'dashboard.html';
                    }, 800);
                } else {
                    showMessage('⚠ ' + data.error, 'error');
                }
            } catch (err) {
                showMessage('⚠ Cannot reach server. Is Docker running?', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Access Dashboard →';
            }
        });

        // Redirect if already logged in
        if (localStorage.getItem('user')) window.location.href = 'dashboard.html';
    </script>
</body>
</html>
